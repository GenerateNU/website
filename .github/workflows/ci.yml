name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SANITY_PROJECT_ID: ${{ vars.VITE_SANITY_PROJECT_ID || 'ci-placeholder' }}
  VITE_SANITY_DATASET: ${{ vars.VITE_SANITY_DATASET || 'ci-placeholder' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: mise run typecheck
      - run: mise run lint
      - run: mise run format-check
      - run: mise run build
      - run: bunx playwright install --with-deps chromium
      - run: mise run test-e2e
